name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Gradle test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: sh gradlew test --no-daemon

      # Docs and Dockerfiles are allowed to claim Java 25 only; CI pins it.
      - name: Docs claim Java 25
        run: bash .github/scripts/check-java-version-docs.sh
