spring.application.name=dynamic-soft-apis
server.address=0.0.0.0
server.port=8081

# ── JWT verification (OAuth2 resource server) ────────────────────────────────
# web-apis verifies RS256 tokens issued by the identity module
# (smallrye-jwt, `Jwt.sign()`). It needs the PUBLIC half of the identity
# signing key — not a secret, but environment-specific, so it is gitignored.
#
# One-time local setup:
#   cd src/identity && openssl genrsa -out jwt-private.pem 2048
#   openssl rsa -in jwt-private.pem -pubout -out ../web-apis/jwt-public.pem
#
# Override the location with JWT_PUBLIC_KEY_LOCATION. Without a valid key
# the app refuses to start (fail fast beats silently 401-ing every request).
security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:jwt-public.pem}
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=mistral
spring.ai.ollama.chat.options.temperature=0.7
