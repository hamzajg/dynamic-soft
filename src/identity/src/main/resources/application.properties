# ── JWT signing ───────────────────────────────────────────────────────────────
# /api/identity/login signs access tokens, so a private key is required.
#
# Generate a local development key (never commit it):
#   openssl genrsa -out jwt-private.pem 2048
#
# Then point JWT_SIGN_KEY_LOCATION at the file, or place it at the default
# location below. The key is gitignored.
# smallrye-jwt resolves key.location as a classpath resource / URL — a bare
# module-relative filename fails in dev mode (the app's CWD is
# build/classes/kotlin/main). Place jwt-private.pem in src/main/resources/
# (gitignored via **/jwt-private.pem) or point JWT_SIGN_KEY_LOCATION at a
# classpath:, file: or http(s): URL.
smallrye.jwt.sign.key.location=${JWT_SIGN_KEY_LOCATION:jwt-private.pem}

# web-apis verifies these tokens as an OAuth2 resource server and needs the
# public half. Derive it once per environment (not a secret, but
# environment-specific — gitignored):
#   openssl rsa -in jwt-private.pem -pubout -out ../web-apis/jwt-public.pem
# or set JWT_PUBLIC_KEY_LOCATION on the web-apis side to any path.
