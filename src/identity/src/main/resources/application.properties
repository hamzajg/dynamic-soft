# ── JWT signing ───────────────────────────────────────────────────────────────
# /api/identity/login signs access tokens, so a private key is required.
#
# Generate a local development key (never commit it):
#   openssl genrsa -out jwt-private.pem 2048
#
# Then point JWT_SIGN_KEY_LOCATION at the file, or place it at the default
# location below. The key is gitignored.
smallrye.jwt.sign.key.location=${JWT_SIGN_KEY_LOCATION:jwt-private.pem}
